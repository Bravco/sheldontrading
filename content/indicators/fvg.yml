author: Andrew
title: Fair Value Gap (FVG)
description: The indicator automatically detects and highlights bullish and bearish Fair Value Gaps (FVGs) directly on the chart. It merges stacked FVGs into cleaner zones, dynamically extends them forward, and removes zones once they are fully mitigated by price.
